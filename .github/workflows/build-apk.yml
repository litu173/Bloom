name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write   # needed to publish the APK as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      # This project was hand-authored without the Flutter SDK (built in a
      # sandboxed environment with no Flutter/Android SDK access), so it
      # ships only lib/, assets/, and pubspec.yaml. `flutter create .`
      # backfills the native android/ + ios/ platform scaffolding Flutter
      # needs to build — it only adds missing platform files and never
      # touches lib/ or pubspec.yaml's existing content.
      - name: Backfill native platform projects
        run: flutter create . --project-name bloom_alarm --platforms=android,ios

      # Flutter 3.24's template pins Kotlin 1.7.10, but current plugins
      # (e.g. shared_preferences_android) ship Kotlin 1.9 metadata.
      - name: Bump Kotlin Gradle plugin
        run: |
          sed -i -E 's/(org\.jetbrains\.kotlin\.android"? version ")[0-9.]+"/\11.9.24"/' android/settings.gradle
          grep -n kotlin android/settings.gradle

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/bloom-alarm.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bloom-alarm-apk
          path: build/app/outputs/flutter-apk/bloom-alarm.apk

      # Publish to a rolling "latest" release so the APK has a direct,
      # login-free download link (Actions artifacts need sign-in and are zipped).
      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Bloom Alarm (latest build)
          body: "Latest build from ${{ github.sha }}. Download bloom-alarm.apk below and open it on your Android phone to install."
          make_latest: true
          files: build/app/outputs/flutter-apk/bloom-alarm.apk
