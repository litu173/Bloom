name: bloom_alarm
description: "Bloom — a calm, gamified wake-up alarm app."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.1
  audioplayers: ^6.0.0
  intl: ^0.19.0
  uuid: ^4.4.0
  vibration: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/splash/
  # assets:
  #   - assets/sounds/   # add .mp3 ringtone files here (see PRODUCT_SPEC.md → Audio Assets)

# ---------------------------------------------------------------------------
# Native (OS-level) launch screen — deliberately minimal per Apple HIG, which
# asks the launch screen to look like an empty first frame of the app rather
# than a branded splash. The full animated "Bloom" experience lives in-app
# at lib/screens/splash_screen.dart and runs *after* this native screen hands
# off to Flutter. Regenerate with: `dart run flutter_native_splash:create`
# ---------------------------------------------------------------------------
flutter_native_splash:
  color: "#191115"
  image: assets/splash/native_launch_logo_512.png
  android_12:
    color: "#191115"
    image: assets/splash/native_launch_logo_512.png
  android: true
  ios: true
  web: false
